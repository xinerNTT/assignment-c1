[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "logscope"
version = "0.1.0"
description = "CLI tool to summarize and analyze application logs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.scripts]
logscope = "logscope.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["logscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
